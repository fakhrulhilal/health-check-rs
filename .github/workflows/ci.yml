name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-features --all-targets
      - name: Each feature builds on its own
        run: |
          for f in "" axum sqlserver postgres postgres-tls redis elasticsearch elasticsearch-tls kafka; do
            echo "::group::features=[$f]"
            cargo check --no-default-features ${f:+--features $f}
            echo "::endgroup::"
          done
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  test:
    name: test (live backends)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
      kafka:
        image: apache/kafka:3.8.0
        ports: ["9092:9092"]
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Str0ng!Passw0rd
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Str0ng!Passw0rd' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      POSTGRES_URL: Host=localhost;Username=postgres;Password=postgres;SSL Mode=Disable
      REDIS_URL: redis://localhost:6379
      ELASTIC_URL: http://localhost:9200
      KAFKA_BROKERS: localhost:9092
      SQLSERVER_CS: Server=tcp:localhost,1433;User Id=sa;Password=Str0ng!Passw0rd;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for Kafka
        run: |
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/9092) 2>/dev/null && exit 0; sleep 2; done
          exit 1
      - run: cargo test --all-features -- --nocapture

  test-macos:
    name: test (macOS, offline)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features
