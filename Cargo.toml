[package]
name = "health-checks"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Health checks modelled on ASP.NET Core's Microsoft.Extensions.Diagnostics.HealthChecks, with optional axum endpoint and ready-made checks for SQL Server, PostgreSQL, Redis, Elasticsearch and Kafka."
license = "MIT"
repository = "https://github.com/fakhrulhilal/health-check-rs"
documentation = "https://docs.rs/health-checks"
readme = "README.md"
exclude = [".github/"]
keywords = ["health", "healthcheck", "readiness", "liveness", "axum"]
categories = ["web-programming", "network-programming"]

[features]
default = []
axum = ["dep:axum"]
sqlserver = ["dep:tiberius", "dep:tokio-util", "tokio/net"]
postgres = ["dep:tokio-postgres", "tokio/net"]
postgres-tls = ["postgres", "tls", "dep:tokio-postgres-rustls"]
redis = ["dep:redis"]
elasticsearch = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "tokio/net"]
elasticsearch-tls = ["elasticsearch", "tls", "dep:hyper-rustls"]
kafka = ["dep:rskafka"]
# rustls config helpers (`health_checks::tls`), pulled in by the *-tls features
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:ring"]
full = ["axum", "sqlserver", "postgres-tls", "redis", "elasticsearch-tls", "kafka"]

[dependencies]
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["time"] }

# optional: HTTP endpoint
axum = { version = "0.8", optional = true, default-features = false }

# optional: backends
# `tiberius-ng` is a maintained fork of tiberius (the original has open RUSTSEC advisories);
# the library name stays `tiberius`.
tiberius = { package = "tiberius-ng", version = "0.13", optional = true, default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
tokio-postgres = { version = "0.7", optional = true, default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14", optional = true, default-features = false, features = ["ring"] }
redis = { version = "1", optional = true, default-features = false, features = ["tokio-comp", "connection-manager"] }
hyper = { version = "1", optional = true, default-features = false }
hyper-util = { version = "0.1", optional = true, default-features = false, features = ["client-legacy", "http1", "tokio"] }
http-body-util = { version = "0.1", optional = true }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http1", "tls12", "ring"] }
rskafka = { version = "0.6", optional = true, default-features = false }

# TLS (only with postgres-tls / elasticsearch-tls). ring, not aws-lc-rs: no C/cmake build.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "0.8", optional = true }
ring = { version = "0.17", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = { version = "0.8", features = ["tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "http1", "tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
ring = "0.17"

[[example]]
name = "axum"
required-features = ["axum"]

[package.metadata.docs.rs]
all-features = true
